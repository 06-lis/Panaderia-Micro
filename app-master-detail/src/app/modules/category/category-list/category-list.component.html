<div class="p-6 mt-10 bg-white text-amber-950 rounded-2xl shadow-md border border-amber-100/70 border-t-4 border-t-[#5C3E21]">
  <!-- Encabezado y Botón -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-extrabold text-[#3E261A]">
      Lista de Categorías
    </h2>
  </div>

  <!-- Tabla -->
  <div class="overflow-x-auto">
    <table class="w-full table-auto text-sm text-center bg-white rounded-xl border-collapse border border-amber-100/60">
      <thead>
        <tr class="bg-[#5C3E21] text-white border-b border-[#3E261A]">
          <th class="px-6 py-3 text-left text-sm font-semibold">ID</th>
          <th class="px-6 py-3 text-left text-sm font-semibold">Categoría</th>
          <th class="px-6 py-3 text-center text-sm font-semibold">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let category of categories"
          class="hover:bg-[#FAF6EE] transition-colors duration-200 border-b border-amber-100/50 last:border-none"
        >
          <td class="px-6 py-4 text-sm font-medium text-[#3E261A]">{{ category.id }}</td>
          <td class="px-6 py-4 text-sm font-semibold text-[#8E4E2A]">{{ category.nombre }}</td>
          <td class="px-6 py-4 text-center flex justify-center gap-2">
            <button (click)="editCategory(category.id!)"
              class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-lg shadow-sm transition-all hover:scale-105 flex items-center gap-1">
              ✏️ Editar
            </button>
            <button (click)="deleteCategory(category.id!)"
              class="px-3.5 py-1.5 bg-red-700 hover:bg-red-800 text-white font-semibold rounded-lg shadow-sm transition-all hover:scale-105 flex items-center gap-1">
              🗑️ Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
