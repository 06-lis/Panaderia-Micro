<div class="flex items-center justify-center min-h-screen bg-[#FAF6EE] p-4">
  <div class="flex max-w-6xl w-full min-h-[620px] bg-[#3E261A] rounded-2xl shadow-2xl overflow-hidden border border-amber-900/10">
    <!-- Sección de imagen -->
    <div class="w-1/2 relative bg-cover bg-center hidden md:block" style="background-image: url('https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=1200&auto=format&fit=crop');">
      <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=1200&auto=format&fit=crop" alt="Panadería Otto - Pan fresco y artesanal" class="h-full w-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-[#3E261A]/80 to-transparent flex items-end p-6">
      </div>
    </div>

    <!-- Sección del formulario -->
    <div class="w-full md:w-1/2 p-10 bg-[#3E261A] flex flex-col justify-center">
      <!-- Título -->
      <h2 class="text-3xl font-bold text-[#FAF6EE] mb-2 tracking-wider text-left flex items-center justify-center space-x-2">
        <!-- Bread Icon SVG -->
        <svg class="w-8 h-8 text-[#C2A378] fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.5 6C17.1 3.2 13.9 2 12 2C10.1 2 6.9 3.2 5.5 6C4 9.1 4 13.9 4 16C4 18.2 5.8 20 8 20H16C18.2 20 20 18.2 20 16C20 13.9 20 9.1 18.5 6ZM16 18H8C6.9 18 6 17.1 6 16C6 14.2 6.1 10.1 7.3 7.7C8.1 6.1 9.9 5 12 5C14.1 5 15.9 6.1 16.7 7.7C17.9 10.1 18 14.2 18 16C18 17.1 17.1 18 16 18Z"/>
        </svg>
        <span>Crear Cuenta</span>
      </h2>
      <p class="text-center text-[#C2A378] text-sm mb-6">
        Regístrate como cliente para realizar tus pedidos más rápido
      </p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Nombre y Apellido en una sola fila -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="nombre" class="block text-xs font-medium text-[#ECE3DB] mb-1">Nombre</label>
            <input
              type="text"
              id="nombre"
              formControlName="nombre"
              class="w-full p-2.5 bg-[#4E3426] text-[#FAF6EE] rounded-lg border border-[#5C3E21] focus:outline-none focus:ring-2 focus:ring-[#8E4E2A] text-sm transition"
              placeholder="Juan"
            />
            <div *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched" class="text-xs text-red-400 mt-1">
              Nombre requerido.
            </div>
          </div>
          <div>
            <label for="apellido" class="block text-xs font-medium text-[#ECE3DB] mb-1">Apellido</label>
            <input
              type="text"
              id="apellido"
              formControlName="apellido"
              class="w-full p-2.5 bg-[#4E3426] text-[#FAF6EE] rounded-lg border border-[#5C3E21] focus:outline-none focus:ring-2 focus:ring-[#8E4E2A] text-sm transition"
              placeholder="Pérez"
            />
            <div *ngIf="registerForm.get('apellido')?.invalid && registerForm.get('apellido')?.touched" class="text-xs text-red-400 mt-1">
              Apellido requerido.
            </div>
          </div>
        </div>

        <!-- Correo Electrónico (Email) -->
        <div>
          <label for="email" class="block text-xs font-medium text-[#ECE3DB] mb-1">Correo Electrónico (Usuario)</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="w-full p-2.5 bg-[#4E3426] text-[#FAF6EE] rounded-lg border border-[#5C3E21] focus:outline-none focus:ring-2 focus:ring-[#8E4E2A] text-sm transition"
            placeholder="juan@correo.com"
          />
          <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-xs text-red-400 mt-1">
            Ingresa un correo electrónico válido.
          </div>
        </div>

        <!-- Celular -->
        <div>
          <label for="celular" class="block text-xs font-medium text-[#ECE3DB] mb-1">Celular / Teléfono</label>
          <input
            type="text"
            id="celular"
            formControlName="celular"
            class="w-full p-2.5 bg-[#4E3426] text-[#FAF6EE] rounded-lg border border-[#5C3E21] focus:outline-none focus:ring-2 focus:ring-[#8E4E2A] text-sm transition"
            placeholder="77712345"
          />
          <div *ngIf="registerForm.get('celular')?.invalid && registerForm.get('celular')?.touched" class="text-xs text-red-400 mt-1">
            Celular requerido (entre 7 y 10 dígitos).
          </div>
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="block text-xs font-medium text-[#ECE3DB] mb-1">Contraseña</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="w-full p-2.5 bg-[#4E3426] text-[#FAF6EE] rounded-lg border border-[#5C3E21] focus:outline-none focus:ring-2 focus:ring-[#8E4E2A] text-sm transition"
            placeholder="••••••••"
          />
          <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-xs text-red-400 mt-1">
            Contraseña requerida (mín. 6 caracteres).
          </div>
        </div>

        <!-- Botón de Registro -->
        <div class="pt-2">
          <button
            type="submit"
            class="w-full py-3 bg-[#8E4E2A] hover:bg-[#7D411F] text-white font-semibold rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#8E4E2A] transition disabled:opacity-50"
            [disabled]="registerForm.invalid || loading"
          >
            <span *ngIf="!loading">Registrarse y Crear Cuenta</span>
            <span *ngIf="loading">Procesando registro...</span>
          </button>
        </div>
      </form>

      <!-- Volver al Login -->
      <div class="text-center mt-6">
        <span class="text-xs text-[#ECE3DB]">¿Ya tienes una cuenta? </span>
        <a routerLink="/auth/login" class="text-xs font-bold text-[#C2A378] hover:text-[#FAF6EE] transition-colors underline">
          Iniciar sesión aquí
        </a>
      </div>
    </div>
  </div>
</div>
