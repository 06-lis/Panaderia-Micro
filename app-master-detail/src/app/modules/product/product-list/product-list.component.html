<!-- Tabla Mejorada -->
<div class="w-full max-w-7xl mx-auto p-6 mt-6 bg-white text-amber-950 rounded-2xl shadow-md border border-amber-100/70 border-t-4 border-t-[#5C3E21]">
  <h2 class="text-3xl font-extrabold mb-8 text-left text-[#3E261A]">
    Lista de Productos
  </h2>

  <div *ngIf="message" class="mt-3 mb-2 p-4 bg-[#FAF6EE] border-l-4 border-[#8E4E2A] text-[#5C3E21] rounded-lg flex items-center justify-between">
    <span>{{ message }}</span>
    <button (click)="message = ''" class="text-[#8E4E2A] hover:text-[#5C3E21] font-bold">
      &times;
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full table-auto text-sm text-center bg-white rounded-xl border-collapse border border-amber-100/60">
      <thead>
        <tr class="bg-[#5C3E21] text-white border-b border-[#3E261A]">
          <th class="px-5 py-3 text-left">ID</th>
          <th class="px-5 py-3 text-left">Producto</th>
          <th class="px-5 py-3 text-left">Precio</th>
          <th class="px-5 py-3 text-left">U. Medida</th>
          <th class="px-5 py-3 text-left">Categoria</th>
          <th class="px-5 py-3 text-left">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of products"
          class="hover:bg-[#FAF6EE] transition-colors duration-200 border-b border-amber-100/50">
          <td class="px-6 py-4">{{ producto.id }}</td>
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0">
                <img *ngIf="producto.imagen" [src]="producto.imagen.startsWith('/') || producto.imagen.startsWith('http') ? producto.imagen : '/' + producto.imagen" [alt]="producto.nombre" class="w-full h-full object-cover" onerror="this.src='assets/default-bakery.jpg'">
                <div *ngIf="!producto.imagen" class="w-full h-full flex items-center justify-center text-gray-400">
                  <i class="pi pi-image text-xl"></i>
                </div>
              </div>
              <span class="font-semibold text-[#8E4E2A]">{{ producto.nombre }}</span>
            </div>
          </td>
          <td class="px-6 py-4 font-bold">{{ producto.precio }} Bs</td>
          <td class="px-6 py-4"><span class="bg-amber-100 text-[#8E4E2A] text-xs px-2 py-1 rounded-full font-semibold">{{ producto.unidadMedida || 'N/A' }}</span></td>
          <td class="px-6 py-4">{{ producto.categoria?.nombre }}</td>
          <td class="px-6 py-4 flex gap-2 justify-center">
            <button (click)="editProduct(producto.id!)"
              class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105 flex items-center gap-1">
              <i class="pi pi-pencil"></i> Editar
            </button>
            <button (click)="deleteProduct(producto.id!)"
              class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105 flex items-center gap-1">
              <i class="pi pi-trash"></i> Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
