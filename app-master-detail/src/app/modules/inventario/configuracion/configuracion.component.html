<div class="p-6 max-w-4xl mx-auto space-y-6">
  <!-- Header Section -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-gradient-to-br from-amber-700 to-amber-900 text-white rounded-2xl flex items-center justify-center shadow-lg transform transition hover:scale-105">
        <i class="pi pi-cog text-xl"></i>
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-amber-950 tracking-tight">Configuración de Inventario</h2>
        <p class="text-sm text-amber-800/80 font-medium">Ajusta los parámetros globales de control de stock y valorización.</p>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 bg-white/50 backdrop-blur-sm rounded-3xl border border-amber-100/50 shadow-sm">
    <div class="w-10 h-10 border-4 border-amber-200 border-t-amber-700 rounded-full animate-spin"></div>
    <span class="text-sm font-bold text-amber-900/60 mt-4 uppercase tracking-widest">Cargando configuración...</span>
  </div>

  <form *ngIf="!loading" [formGroup]="configForm" (ngSubmit)="onSubmit()" class="bg-white rounded-3xl shadow-xl shadow-amber-900/5 border border-amber-100/50 overflow-hidden">
    <div class="h-1 w-full bg-gradient-to-r from-amber-400 via-amber-600 to-amber-800"></div>
    
    <div class="p-8 space-y-8">
      
      <!-- Sección: Valuación y Políticas -->
      <section>
        <h3 class="text-lg font-bold text-amber-950 border-b border-amber-100/50 pb-2 mb-4 flex items-center gap-2">
          <i class="pi pi-calculator text-amber-500"></i> Valuación y Políticas Generales
        </h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Método de Valuación (Por defecto)</label>
            <select formControlName="metodoValuacionPorDefecto"
                    class="w-full px-4 py-3 bg-amber-50/30 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600/50 focus:border-amber-600 transition-all text-sm font-medium">
              <option value="FIFO">PEPS (FIFO) - Primeros en Entrar, Primeros en Salir</option>
              <option value="LIFO">UEPS (LIFO) - Últimos en Entrar, Primeros en Salir</option>
              <option value="PROMEDIO">Promedio Ponderado</option>
            </select>
          </div>

          <div class="flex items-center bg-amber-50/30 border border-amber-200 rounded-xl px-4 py-3">
            <label class="flex items-center cursor-pointer gap-3 w-full">
              <div class="relative">
                <input type="checkbox" formControlName="permitirStockNegativo" class="sr-only">
                <div class="block bg-amber-200 w-10 h-6 rounded-full transition-colors" [ngClass]="{'bg-amber-600': configForm.get('permitirStockNegativo')?.value}"></div>
                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" [ngClass]="{'transform translate-x-4': configForm.get('permitirStockNegativo')?.value}"></div>
              </div>
              <div>
                <span class="text-sm font-bold text-amber-900">Permitir Stock Negativo</span>
                <p class="text-xs text-amber-700/60 leading-tight">Autoriza ventas sin inventario físico suficiente.</p>
              </div>
            </label>
          </div>
        </div>
      </section>

      <!-- Sección: Vencimientos -->
      <section>
        <h3 class="text-lg font-bold text-amber-950 border-b border-amber-100/50 pb-2 mb-4 flex items-center gap-2">
          <i class="pi pi-calendar text-amber-500"></i> Gestión de Vencimientos
        </h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Días de Notificación (Previo al vencimiento)</label>
            <div class="relative">
              <input type="number" formControlName="diasNotificacionVencimiento"
                     class="w-full px-4 py-3 bg-amber-50/30 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600/50 focus:border-amber-600 transition-all text-sm font-medium pr-12" />
              <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-amber-800/50 text-sm font-bold">
                días
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Vencimiento por Defecto (Producción)</label>
            <div class="relative">
              <input type="number" formControlName="diasPorDefectoVencimiento"
                     class="w-full px-4 py-3 bg-amber-50/30 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600/50 focus:border-amber-600 transition-all text-sm font-medium pr-12" />
              <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-amber-800/50 text-sm font-bold">
                días
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Sección: Alertas de Stock -->
      <section>
        <h3 class="text-lg font-bold text-amber-950 border-b border-amber-100/50 pb-2 mb-4 flex items-center gap-2">
          <i class="pi pi-bell text-amber-500"></i> Alertas de Stock
        </h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
          <div class="flex items-center bg-amber-50/30 border border-amber-200 rounded-xl px-4 py-3">
            <label class="flex items-center cursor-pointer gap-3 w-full">
              <div class="relative">
                <input type="checkbox" formControlName="notificarStockBajo" class="sr-only">
                <div class="block bg-amber-200 w-10 h-6 rounded-full transition-colors" [ngClass]="{'bg-amber-600': configForm.get('notificarStockBajo')?.value}"></div>
                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" [ngClass]="{'transform translate-x-4': configForm.get('notificarStockBajo')?.value}"></div>
              </div>
              <div>
                <span class="text-sm font-bold text-amber-900">Activar Alertas de Stock Bajo</span>
              </div>
            </label>
          </div>

          <div *ngIf="configForm.get('notificarStockBajo')?.value">
            <label class="block text-xs font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Nivel de Stock Bajo (Umbral global)</label>
            <div class="relative">
              <input type="number" formControlName="nivelStockBajo"
                     class="w-full px-4 py-3 bg-amber-50/30 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600/50 focus:border-amber-600 transition-all text-sm font-medium pr-16" />
              <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-amber-800/50 text-sm font-bold">
                unidades
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Acciones -->
    <div class="bg-amber-50/50 px-8 py-5 border-t border-amber-100/50 flex justify-end">
      <button type="submit" [disabled]="configForm.invalid || saving"
              class="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <i *ngIf="!saving" class="pi pi-save"></i>
        <span *ngIf="saving" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        {{ saving ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>
  </form>
</div>
